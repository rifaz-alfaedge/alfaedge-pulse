[project]
name = "alfaedge_pulse"
authors = [
    { name = "AlfaEdge", email = "rifazmohammed@gmail.com"}
]
description = "Standalone real-time monitoring dashboard for Proxmox VE hosts, VMs, CTs, and Proxmox Backup Server"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["license.txt"]
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    "requests>=2.31.0",
    # Used only for Uptime Kuma's internal (unofficial) Socket.IO API, to
    # add/edit/delete/pause/resume monitors from this app's dashboard —
    # see uptime_kuma_client/socketio_client.py. Status polling for
    # alerting instead uses Kuma's official, stable Prometheus /metrics
    # endpoint via plain `requests`, so this dependency's blast radius is
    # limited to that one admin-initiated convenience feature.
    "python-socketio[client]>=5.11.0",
    # Standalone console-relay process (console_relay/relay.py) — asyncio
    # WS server+client in one package, used to bridge a browser's embedded
    # VNC/terminal session to a Proxmox host's vncwebsocket endpoint. Not
    # imported by the Frappe app itself, only by that standalone script.
    "websockets>=13.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
